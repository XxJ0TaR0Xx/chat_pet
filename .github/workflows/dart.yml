name: Flutter CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Устанавливаем Flutter вместо Dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'  # или конкретная версия

      - name: Install dependencies
        run: flutter pub get  # ← исправлено на flutter pub get

      - name: Analyze project source
        run: flutter analyze  # ← исправлено на flutter analyze

      - name: Run tests
        run: flutter test  # ← исправлено на flutter test

      # Дополнительные полезные шаги для Flutter:
      - name: Check formatting
        run: flutter format --set-exit-if-changed .

      - name: Build APK (опционально)
        run: flutter build apk --release
