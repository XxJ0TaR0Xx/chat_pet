name: chat_pet
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"

dependency_overrides: 
  dart_style: 3.1.2

dependencies:
  flutter:
    sdk: flutter

  #ui utils
  flutter_screenutil: ^5.9.3
  awesome_extensions: ^2.0.26
  flutter_svg: ^2.0.17
  auto_size_text: ^3.0.0

  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  
  #localization
  intl: ^0.20.2
  flutter_localization: ^0.3.3
  




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_gen_runner: ^5.9.0
  build_runner: ^2.4.9
  bloc_lint: ^0.3.1
  intl_utils: ^2.8.12

flutter:
  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Caros
      fonts:
        - asset: assets/fonts/Caros.otf
    - family: CircularStd
      fonts:
        - asset: assets/fonts/CircularStd-Black.otf
  uses-material-design: true
  generate: true


flutter_gen:
  output: lib/tokens
  line_length: 120
  integrations:
    flutter_svg: true
    lottie: true
  assets:
    enabled: true
#    fonts:
#      enabled: false
    outputs:
      style: dot-delimiter
      package_parameter_enabled: true
#      synthetic-package: false

flutter_intl:
  enabled: true
  arb_dir: lib/localization/arb
  output_dir: lib/localization
